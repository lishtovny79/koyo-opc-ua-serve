[plc]
# IP-адрес Ethernet-интерфейса Koyo / DirectLOGIC.
host = "127.0.0.1"
# Необязательный параметр. Пустая строка запускает сервер без тегов; создавайте
# их через Objects/TagManagement/AddTag. Не добавляйте производственный экспорт в Git.
tags_csv = ""
# SQLite хранит импортированные из CSV и созданные клиентом теги. В цикле
# опроса PLC обращения к БД не выполняются.
tags_database = "../data/tags.db"
backup_directory = "../backups"

[opcua]
# Сертификаты в этом проекте намеренно не используются.
endpoint = "opc.tcp://0.0.0.0:4840/"

[polling]
# Меньшее значение сокращает задержку обновления, но повышает нагрузку на PLC.
interval_seconds = 0.1
# Задержка до обработки записи от OPC UA-клиента.
write_subscription_interval_ms = 10
receive_timeout_seconds = 0.8
# Максимум последовательных слов PLC в одном запросе. Перед увеличением
# подтвердите допустимый лимит для вашего контроллера/интерфейса.
read_block_words = 30

[logging]
level = "INFO"
